<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="duddev-mark-title">
  <title id="duddev-mark-title">duDDev</title>
  <defs>
    <linearGradient id="dd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <g transform="translate(128 132) scale(0.62)">
      <!-- ===== LEFT D ===== -->
      <g>
        <!-- bowl: shoulder + outer edge + foot, closed against the stem -->
        <path d="M 14 -104 L 40 -104 L 40 104 L 14 104
                 L 14 66 L -30 66 L -66 40 L -66 -40 L -30 -66 L 14 -66 Z"
              fill="url(#dd)"/>
        <path d="M 14 -104 L 40 -104 L 40 0 L 14 0 L 14 -66 L -30 -66 L -66 -40 Z"
              fill="url(#sheen)"/>
      </g>

      <!-- ===== RIGHT D ===== -->
      <g>
        <path d="M -40 -104 L -14 -104 L -14 -66 L 30 -66 L 66 -40 L 66 40 L 30 66 L -14 66 L -14 104 L -40 104 Z"
              fill="url(#dd)"/>
        <path d="M -40 -104 L -14 -104 L -14 -66 L 30 -66 L 66 -40 L 66 0 L -40 0 Z"
              fill="url(#sheen)"/>
      </g>
    </g>
</svg>
