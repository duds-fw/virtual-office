    <!-- right D body -->
    <path d="M128 58 C164 64,194 90,194 114 C194 138,164 164,128 170 L128 144 C150 136,150 84,128 76 Z"/>
    <!-- right D top fold -->
    <path d="M128 58 L128 28 L100 34 L108 58 Z"/>
    <!-- right D bottom fold -->
