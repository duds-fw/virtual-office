      <stop offset="0" stop-color="#3b5cff"/>
      <stop offset="0.4" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="0.75" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22d3ee"/>
