<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="duddev-logo-title">
  <title id="duddev-logo-title">duDDev</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>

    <!-- One continuous gradient across the whole monogram: cyan -> blue -> violet -->
    <linearGradient id="dd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>

    <clipPath id="badgeClip">
      <rect x="0" y="0" width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badgeClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#badge)"/>

    <!-- ============ MONOGRAM ============
         Two mirrored angular 'D' glyphs drawn as closed outlines.
         Each D: vertical stem on the inner side + angular bowl reaching outward.
         A clear gap separates the two glyphs at the centre.
         Geometry (local to the monogram box, x in [-96,96], y in [-104,104]):
           LEFT D  : stem  x=+8..+34 ; bowl reaches x=-80
           RIGHT D : stem  x=-34..-8 ; bowl reaches x=+80
    -->
    <g transform="translate(256 200)">
      <!-- ===== LEFT D ===== -->
      <g>
        <!-- bowl: shoulder + outer edge + foot, closed against the stem -->
        <path d="M 14 -104 L 40 -104 L 40 104 L 14 104
                 L 14 66 L -30 66 L -66 40 L -66 -40 L -30 -66 L 14 -66 Z"
              fill="url(#dd)"/>
        <path d="M 14 -104 L 40 -104 L 40 0 L 14 0 L 14 -66 L -30 -66 L -66 -40 Z"
              fill="url(#sheen)"/>
      </g>

      <!-- ===== RIGHT D ===== -->
      <g>
        <path d="M -40 -104 L -14 -104 L -14 -66 L 30 -66 L 66 -40 L 66 40 L 30 66 L -14 66 L -14 104 L -40 104 Z"
              fill="url(#dd)"/>
        <path d="M -40 -104 L -14 -104 L -14 -66 L 30 -66 L 66 -40 L 66 0 L -40 0 Z"
              fill="url(#sheen)"/>
      </g>
    </g>

    <!-- ============ WORDMARK ============ -->
    <text x="256" y="402"
          text-anchor="middle"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
          font-size="98"
          font-weight="600"
          letter-spacing="-2"
          fill="#f8fafc">duDDev</text>
  </g>
</svg>
